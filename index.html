<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

                <p>Әдепкі кодтар: <span class="font-mono font-bold text-slate-600">TCH-9921</span>, <span class="font-mono font-bold text-slate-600">TCH-4412</span></p>

    <!-- Негізгі қолданба контейнері -->
    <div id="appContainer" class="flex-1 flex flex-col hidden">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 py-3.5 flex items-center justify-between shadow-xs">

                </div>
                <div>
                    <div class="flex items-center gap-2">

                        <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 text-[10px] font-extrabold uppercase rounded-md border border-indigo-100">Cloud</span>

            </div>
            <div class="flex items-center gap-4">

        <div class="flex-1 flex flex-col md:flex-row">
            <!-- Сайдбар меню -->

                <button onclick="switchTab('folder')" id="btn-folder" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">

                <button onclick="switchTab('parents')" id="btn-parents" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">

                <button onclick="switchTab('docs')" id="btn-docs" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">

                </button>
                <button onclick="switchTab('students')" id="btn-students" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-user-graduate w-5 text-center"></i> Оқушы құжаттары
                </button>
                <button onclick="switchTab('events')" id="btn-events" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-calendar-days w-5 text-center"></i> Іс-шаралар тізімі
                </button>
                <button onclick="switchTab('plan')" id="btn-plan" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i> Тәрбие жұмыс жоспары
                </button>
                <button onclick="switchTab('teachers')" id="btn-teachers" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-chalkboard-user w-5 text-center"></i> Сынып жетекшілер
                </button>
                <button onclick="switchTab('period')" id="btn-period" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Есептік кезең
                </button>

            <!-- Негізгі контент аймағы -->
            <main class="flex-1 p-4 md:p-6 overflow-y-auto">
                <div id="tabContent" class="max-w-6xl mx-auto space-y-6">
                    <!-- Dinamika arqyly toltyrylady -->
                </div>
            </main>
        </div>
    </div>

    <!-- Құжат немесе жазба қосу модальды терезесі -->
    <div id="actionModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 md:p-8 space-y-5">
            <h3 id="modalTitle" class="text-xl font-black text-slate-900">Жаңа құжат қосу</h3>
            <div id="modalFormFields" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Динамикалық өрістер -->
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <button onclick="closeModal()" class="px-5 py-2.5 border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-2xl text-sm font-semibold transition">Болдырмау</button>
                <button onclick="saveRecord()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-sm font-semibold transition shadow-md shadow-indigo-200">Сақтау</button>
            </div>
        </div>
    </div>

    <!-- Firebase және қолданба логикасы -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-portal-default-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDefaultKeyForLocalTestingOnly12345",
            authDomain: "default-project.firebaseapp.com",
            projectId: "default-project",
            storageBucket: "default-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        let app, db, auth;
        let currentUser = null;
        let currentUserRole = null; 
        let currentActiveTab = 'orders';
        let activeModalType = '';
        let searchQuery = '';

        const dbData = {
            orders: [],
            folder: [],
            parents: [],
            docs: [],
            students: [],
            events: [],
            plan: [],
            teachers: [],
            period: { startDate: "2026-01-01", endDate: "2026-06-01", status: "Тексеру мерзімі ашық" }
        };

        const defaultInitialData = {
            orders: [
                { id: "o1", title: "№45 Бұйрық: Қауіпсіздік ережелерін сақтау туралы", date: "2026-02-10", type: "PDF", size: "2.4 MB" },
                { id: "o2", title: "№48 Бұйрық: Оқу жылындағы тәрбие жоспары", date: "2026-01-15", type: "WORD", size: "1.1 MB" }
            ],
            folder: [
                { id: "f1", grade: "5 'А' сыныбы", title: "Сынып отырыстарының хаттамалары", date: "2026-02-01", type: "EXCEL", size: "850 KB" },
                { id: "f2", grade: "8 'Б' сыныбы", title: "Оқушылардың әлеуметтік паспорты", date: "2026-01-20", type: "PDF", size: "3.2 MB" }
            ],
            parents: [
                { id: "p1", title: "Ата-аналар комитетінің жиналыс хаттамасы №1", date: "2026-02-05", type: "WORD", grade: "6 'А'" },
                { id: "p2", title: "Педагогикалық қолдау және кеңес беру материалдары", date: "2026-01-18", type: "PDF", grade: "Барлығы" }
            ],
            docs: [
                { id: "d1", title: "Әдістемелік нұсқаулықтар мен хаттамалар жинағы", date: "2026-02-02", type: "PDF" },
                { id: "d2", title: "Тәрбиешілер кеңесінің шешімдері", date: "2026-01-10", type: "WORD" }
            ],
            students: [
                { id: "s1", grade: "7 'Ә'", name: "Аманжолқызы Айғаным", birthDate: "2013-05-12", iin: "130512400123", socialStatus: "Тұрмысы төмен отбасы", schoolAccount: "Жоқ" },
                { id: "s2", grade: "9 'Б'", name: "Бейбітұлы Ернар", birthDate: "2011-11-20", iin: "111120300456", socialStatus: "Көпбалалы отбасы", schoolAccount: "Ішкі есепте тұрады" }
            ],
            events: [
                { id: "e1", title: "«Зорлық-зомбылыққа жол жоқ» акциясы", date: "2026-02-08", format: "Фото/Видео, ҚМЖ, КТП", details: "Ашық тәрбие сағаты өткізілді." },
                { id: "e2", title: "«Абай оқулары» байқауы", date: "2026-01-25", format: "Презентация, КТП", details: "Мектепшілік кезең." }
            ],
            plan: [
                { id: "pl1", category: "Жылдық жоспар", title: "2025-2026 оқу жылына арналған тәрбие жұмысының кешенді жоспары", type: "PDF" },
                { id: "pl2", category: "Қауіпсіздік ережесі", title: "Жолда жүру және өрт қауіпсіздігі ережелерінің жадынамасы", type: "WORD" },
                { id: "pl3", category: "Психологпен бірлескен жұмыс", title: "Бейімделу кезеңіндегі оқушыларға психологиялық тренинг кестесі", type: "EXCEL" }
            ],
            teachers: [
                { id: "t1", name: "Сейдахметова Г.К.", grade: "5 'А'", code: "TCH-9921", status: "Белсенді" },
                { id: "t2", name: "Жұмабаев Б.Т.", grade: "10 'Б'", code: "TCH-4412", status: "Белсенді" }
            ],
            period: { startDate: "2026-01-01", endDate: "2026-06-01", status: "Тексеру мерзімі ашық" }
        };

        async function initFirebaseApp() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        setupFirestoreListeners();
                    }
                });
            } catch (e) {
                console.warn("Firebase initialization warning. Using local state fallback.", e);
                loadInitialDataFallback();
            }
        }

        function loadInitialDataFallback() {
            Object.assign(dbData, defaultInitialData);
        }

        function setupFirestoreListeners() {
            if (!currentUser) return;
            
            const categories = ['orders', 'folder', 'parents', 'docs', 'students', 'events', 'plan', 'teachers', 'period'];
            
            categories.forEach(cat => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', cat);
                onSnapshot(colRef, (snapshot) => {
                    if (!snapshot.empty) {
                        const items = [];
                        snapshot.forEach(docSnap => {
                            items.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        if (cat === 'period') {
                            if (items.length > 0) dbData.period = items[0];
                        } else {
                            dbData[cat] = items;
                        }
                    } else {
                        if (defaultInitialData[cat]) {
                            if (cat === 'period') {
                                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'period', 'current'), defaultInitialData.period).catch(()=>{});
                            } else {
                                defaultInitialData[cat].forEach(item => {
                                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', cat, item.id), item).catch(()=>{});
                                });
                            }
                        }
                    }
                    renderTabContent(false);
                }, (error) => {
                    console.warn(`Error loading ${cat}:`, error);
                    loadInitialDataFallback();
                });
            });
        }

        async function persistRecord(category, recordId, dataObj) {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', category, String(recordId));
                await setDoc(docRef, dataObj);
            } catch (e) {
                console.error("Firestore save error:", e);
            }
        }

        async function removeRecord(category, recordId) {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', category, String(recordId));
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Firestore delete error:", e);
            }
        }

        window.showNotification = function(title, message, isError = false) {
            document.getElementById('notifTitle').innerText = title;
            document.getElementById('notifMessage').innerText = message;
            const iconDiv = document.getElementById('notifIcon');
            if (isError) {
                iconDiv.className = "w-14 h-14 rounded-full flex items-center justify-center mx-auto text-2xl bg-red-100 text-red-600";
                iconDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconDiv.className = "w-14 h-14 rounded-full flex items-center justify-center mx-auto text-2xl bg-indigo-100 text-indigo-600";
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
            }
            document.getElementById('notificationModal').classList.remove('hidden');
        }

        window.closeNotification = function() {
            document.getElementById('notificationModal').classList.add('hidden');
        }

        window.loginAsAdmin = function() {
            currentUserRole = 'admin';
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userRoleIndicator').innerText = "Рөл: Администратор (Mektep.Edu)";
            renderTabContent();
        }

        window.loginAsTeacher = function() {
            const codeInput = document.getElementById('teacherCodeInput');
            const code = codeInput ? codeInput.value.trim().toUpperCase() : "";
            
            if (!code) {
                showNotification("Қате", "Бір реттік кодты енгізіңіз!", true);
                return;
            }

            // Тізімнен іздеу немесе кез келген дұрыс TCH- коды немесе KOD- коды болса кіруге рұқсат беру
            const foundTeacher = dbData.teachers.find(t => t.code && t.code.toUpperCase() === code);

            if (foundTeacher || code.startsWith("TCH-") || code.startsWith("KOD-") || code.length >= 4) {
                currentUserRole = 'teacher';
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                const teacherName = foundTeacher ? foundTeacher.name : `Сынып Жетекші (${code})`;
                document.getElementById('userRoleIndicator').innerText = `Рөл: ${teacherName}`;
                renderTabContent();
            } else {
                showNotification("Қате код", "Дұрыс кодты енгізіңіз (Мысалы: TCH-9921 немесе әдепкі кодтардың бірі).", true);
            }
        }

        window.logout = function() {
            currentUserRole = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authModal').classList.remove('hidden');
            const codeInput = document.getElementById('teacherCodeInput');
            if (codeInput) codeInput.value = '';
            searchQuery = '';
        }

        window.switchTab = function(tabKey) {
            currentActiveTab = tabKey;
            searchQuery = '';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-50', 'text-indigo-700', 'shadow-xs');
                btn.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            const activeBtn = document.getElementById(`btn-${tabKey}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-indigo-50', 'text-indigo-700', 'shadow-xs');
                activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
            }
            renderTabContent();
        }

        window.filterTable = function(input) {
            searchQuery = input.value.toLowerCase();
            renderTabContent(false);
        }

                    contentHTML = generateFolderTable();
                    break;
                case 'parents':

                    contentHTML = generateParentsTable();

                    contentHTML = generateStudentsTable();

            container.innerHTML = headerHTML + contentHTML;

                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Сыныбы</label><input type="text" id="m_grade" placeholder="Мысалы: 6 'Б'" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Құжат атауы</label><input type="text" id="m_title" placeholder="Құжат атауы" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Форматы</label><select id="m_format" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="PDF">PDF</option><option value="WORD">WORD</option><option value="EXCEL">EXCEL</option></select></div>
                `;
            } else if (activeModalType === 'parents') {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Жұмыс тақырыбы / атауы</label><input type="text" id="m_title" placeholder="Жиналыс атауы" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Сыныбы</label><input type="text" id="m_grade" placeholder="Мысалы: 6 'А' немесе Барлығы" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Форматы</label><select id="m_format" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="WORD">WORD</option><option value="PDF">PDF</option></select></div>
                `;
            } else if (activeModalType === 'events') {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Іс-шара атауы</label><input type="text" id="m_title" placeholder="Іс-шара атауы" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Форматы</label><input type="text" id="m_format" placeholder="Мысалы: Фото/Видео, ҚМЖ, КТП" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Сипаттамасы</label><textarea id="m_details" placeholder="Қысқаша сипаттама..." class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea></div>
                `;
            } else if (activeModalType === 'teachers') {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Мұғалім аты-жөні</label><input type="text" id="m_name" placeholder="Мысалы: Ахметова З.Б." class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Сыныбы</label><input type="text" id="m_grade" placeholder="Мысалы: 8 'В'" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Бір реттік кіру коды</label><input type="text" id="m_code" placeholder="Мысалы: TCH-7788" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm uppercase font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                `;
            } else {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Құжат атауы</label><input type="text" id="m_title" placeholder="Құжат атауы" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
                    ${activeModalType === 'plan' ? `<div><label class="block text-xs font-bold text-slate-600 mb-1">Санаты</label><input type="text" id="m_category" placeholder="Мысалы: Жылдық жоспар" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>` : ''}
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Түрі немесе форматы</label><select id="m_format" class="w-full px-4 py-3 border border-slate-200 bg-slate-50/50 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="PDF">PDF</option><option value="WORD">WORD</option><option value="EXCEL">EXCEL</option></select></div>
                `;
            }

            document.getElementById('actionModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('actionModal').classList.add('hidden');
        }

        window.saveRecord = async function() {
            const today = new Date().toISOString().split('T')[0];
            const recordId = 'rec_' + Date.now();
            let newObj = {};

            if (activeModalType === 'students') {
                const grade = document.getElementById('m_grade').value.trim();
                const name = document.getElementById('m_name').value.trim();
                const birthDate = document.getElementById('m_birth').value;
                const iin = document.getElementById('m_iin').value.trim();
                const socialStatus = document.getElementById('m_status').value.trim();
                const schoolAccount = document.getElementById('m_account').value;

                if (!grade || !name || !iin) {
                    showNotification("Қате", "Барлық міндетті өрістерді толтырыңыз!", true);
                    return;
                }
                newObj = { id: recordId, grade, name, birthDate, iin, socialStatus, schoolAccount };
            } else if (activeModalType === 'folder') {
                const grade = document.getElementById('m_grade').value.trim();
                const title = document.getElementById('m_title').value.trim();
                const type = document.getElementById('m_format').value;

                if (!grade || !title) {
                    showNotification("Қате", "Өрістерді бос қалдырмаңыз!", true);
                    return;
                }
                newObj = { id: recordId, grade, title, date: today, type, size: "1.2 MB" };
            } else if (activeModalType === 'parents') {
                const title = document.getElementById('m_title').value.trim();
                const grade = document.getElementById('m_grade').value.trim();
                const type = document.getElementById('m_format').value;

                if (!title || !grade) {
                    showNotification("Қате", "Өрістерді бос қалдырмаңыз!", true);
                    return;
                }
                newObj = { id: recordId, title, date: today, type, grade };
            } else if (activeModalType === 'events') {
                const title = document.getElementById('m_title').value.trim();
                const format = document.getElementById('m_format').value.trim();
                const details = document.getElementById('m_details').value.trim();

                if (!title) {
                    showNotification("Қате", "Іс-шара атауын енгізіңіз!", true);
                    return;
                }
                newObj = { id: recordId, title, date: today, format: format || 'ҚМЖ, КТП', details: details || 'Өткізілді' };
            } else if (activeModalType === 'teachers') {
                const name = document.getElementById('m_name').value.trim();
                const grade = document.getElementById('m_grade').value.trim();
                const code = document.getElementById('m_code').value.trim().toUpperCase();

                if (!name || !grade || !code) {
                    showNotification("Қате", "Барлық өрістерді толтырыңыз!", true);
                    return;
                }
                newObj = { id: recordId, name, grade, code, status: "Белсенді" };
            } else {
                const title = document.getElementById('m_title').value.trim();
                const type = document.getElementById('m_format').value;
                const category = document.getElementById('m_category') ? document.getElementById('m_category').value.trim() : "";

                if (!title) {
                    showNotification("Қате", "Құжат атауын енгізіңіз!", true);
                    return;
                }

                if (activeModalType === 'plan') {
                    newObj = { id: recordId, category: category || 'Тәрбие жоспары', title, type };
                } else if (activeModalType === 'orders') {
                    newObj = { id: recordId, title, date: today, type, size: "1.5 MB" };
                } else {
                    newObj = { id: recordId, title, date: today, type };
                }
            }

            dbData[activeModalType].push(newObj);
            await persistRecord(activeModalType, recordId, newObj);

            closeModal();
            renderTabContent();
            showNotification("Сәтті", "Жаңа жазба жүйеге сақталды!");
        }

        window.deleteRecord = async function(category, id) {
            if (currentUserRole !== 'admin' && category === 'teachers') {
                showNotification("Құқық жоқ", "Мұғалімдерді тек администратор ғана жоя алады!", true);
                return;
            }
            dbData[category] = dbData[category].filter(item => String(item.id) !== String(id));
            renderTabContent();
            await removeRecord(category, id);
            showNotification("Жойылды", "Жазба жүйеден өшірілді.");
        }

        window.downloadItem = function(itemName) {
            showNotification("Жүктеу", `"${itemName}" файлы жүктелуде... (Бұлттық қоймадан)`);
        }

        window.savePeriod = async function() {
            const start = document.getElementById('periodStart').value;
            const end = document.getElementById('periodEnd').value;
            const status = document.getElementById('periodStatus').value;

            dbData.period = { startDate: start, endDate: end, status };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'period', 'current'), dbData.period);

            showNotification("Сақталды", "Есептік кезең және мерзім сақталды!");
        }

        window.onload = function() {
            initFirebaseApp();
        };
    </script>
</body>
</html>
